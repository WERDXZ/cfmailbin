# Portable defaults. Create your own resources and fill in their IDs before deploying.
# Keep instance-specific configuration on a local deploy branch; see docs/deploy.md.
name = "cfmailbin"
main = "src/entry.ts"
compatibility_date = "2026-04-24"

[build]
command = "deno task ui:build"

[assets]
directory = "./dist/ui"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[observability]
enabled = true

[observability.traces]
enabled = true

[vars]
# Receiving/AI preferences are initial defaults. Saved /settings preferences in
# the SETTINGS KV namespace take precedence; identity and secrets stay here.
CFMAILBIN_APP_NAME = "cfmailbin"
# Optional default for generated registration addresses. Configure Email Routing separately.
# CFMAILBIN_EMAIL_DOMAIN = "example.com"
# Required for dashboard/API access; see docs/access.md.
# CFMAILBIN_OWNER_EMAIL = "owner@example.net"
# CFMAILBIN_ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
# CFMAILBIN_ACCESS_AUD = "your-access-application-aud"
CFMAILBIN_ALLOW_CATCH_ALL = "false"
# CFMAILBIN_AUTO_CREATE_ALIAS_TAG = "auto-created"
CFMAILBIN_DEFAULT_RETENTION_DAYS = "7"
# CFMAILBIN_FORWARD_TO = "owner@example.com"
# Optional AI fallback via AI Gateway. Store the model key in Gateway BYOK (default)
# or a Worker secret; CF_AIG_TOKEN must be a Worker secret, never in this file.
# See docs/email-analysis.md. Apply migration 0005 before deploying.
CFMAILBIN_AI_ENABLED = "false"
CFMAILBIN_AI_PROVIDER = "deepseek" # or "openai" for gpt-5.6-luna
CFMAILBIN_AI_DAILY_LIMIT = "100"
# CFMAILBIN_AI_GATEWAY_ACCOUNT_ID = "your-32-character-cloudflare-account-id"
# CFMAILBIN_AI_GATEWAY_ID = "your-gateway-id"

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "cfmailbin"
# Replace with the ID returned by wrangler d1 create.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "RAW_EMAILS"
bucket_name = "cfmailbin-raw-emails"
preview_bucket_name = "cfmailbin-raw-emails-preview"

[[durable_objects.bindings]]
name = "INBOX_EVENTS"
class_name = "InboxEventsObject"

[[migrations]]
tag = "inbox-events-v1"
new_sqlite_classes = ["InboxEventsObject"]

[[kv_namespaces]]
binding = "SETTINGS"
# Replace with the ID returned by wrangler kv namespace create.
id = "00000000000000000000000000000000"
